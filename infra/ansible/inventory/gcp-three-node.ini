[k3s_server]
kuberag-server ansible_host=kuberag-gcp ansible_user=kuberag ansible_python_interpreter=/usr/bin/python3

[k3s_workers]
kuberag-worker-observability ansible_host=10.42.0.3 k3s_node_role=observability k3s_data_disk_device=/dev/disk/by-id/google-kuberag-worker-observability-data ansible_user=kuberag ansible_python_interpreter=/usr/bin/python3
kuberag-worker-application ansible_host=10.42.0.4 k3s_node_role=application k3s_data_disk_device=/dev/disk/by-id/google-kuberag-worker-application-data ansible_user=kuberag ansible_python_interpreter=/usr/bin/python3

[k3s_workers:vars]
# kuberag-gcp is the existing local SSH/IAP host alias for the server. Workers
# deliberately have no public IP and are reached through that private-network hop.
ansible_ssh_common_args='-o ProxyJump=kuberag-gcp'
