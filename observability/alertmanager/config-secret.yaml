apiVersion: v1
kind: Secret
metadata:
  name: kuberag-alertmanager-config
  namespace: observability
type: Opaque
stringData:
  alertmanager.yaml: |
    global:
      resolve_timeout: 1m
    route:
      receiver: slack
      group_by:
        - alertname
        - namespace
        - pod
      group_wait: 30s
      group_interval: 5m
      repeat_interval: 4h
    receivers:
      - name: slack
        slack_configs:
          - api_url_file: /etc/alertmanager/secrets/kuberag-slack-webhook/api-url
            send_resolved: true
            color: '{{ if eq .Status "firing" }}danger{{ else }}good{{ end }}'
            title: >-
              {{ if eq .Status "firing" }}FIRING{{ else }}RESOLVED{{ end }}
              | {{ .CommonLabels.alertname }}
              {{ if .CommonLabels.severity }}({{ .CommonLabels.severity }}){{ end }}
            text: |-
              {{ range .Alerts -}}
              *Summary:* {{ .Annotations.summary }}
              {{- if .Labels.namespace }}

              *Namespace:* `{{ .Labels.namespace }}`{{ end }}
              {{- if .Labels.pod }}

              *Pod:* `{{ .Labels.pod }}`{{ end }}
              {{- if .Labels.container }}

              *Container:* `{{ .Labels.container }}`{{ end }}

              {{ if .Annotations.dashboard_url }}<{{ .Annotations.dashboard_url }}|Open Grafana panel>{{ "\n" }}{{ end -}}
              <http://127.0.0.1:3000/alerting/list|Open Grafana alerting>
              {{- if .Annotations.runbook_url }}
              <{{ .Annotations.runbook_url }}|Runbook>
              {{- end }}
              {{ end }}
