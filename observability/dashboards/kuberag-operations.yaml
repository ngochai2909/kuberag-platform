apiVersion: v1
kind: ConfigMap
metadata:
  name: kuberag-operations-dashboard
  namespace: observability
  labels:
    grafana_dashboard: "1"
    app.kubernetes.io/part-of: kuberag
data:
  kuberag-operations.json: |
    {
      "annotations": {"list": []},
      "editable": false,
      "panels": [
        {
          "datasource": {"type": "prometheus", "uid": "prometheus"},
          "fieldConfig": {"defaults": {"unit": "s"}, "overrides": []},
          "gridPos": {"h": 8, "w": 12, "x": 0, "y": 0},
          "id": 1,
          "targets": [
            {"expr": "histogram_quantile(0.50, sum by (le) (rate(kuberag_api_request_duration_seconds_bucket{route=\"/api/v1/query\"}[$__rate_interval])))", "legendFormat": "p50", "refId": "A"},
            {"expr": "histogram_quantile(0.95, sum by (le) (rate(kuberag_api_request_duration_seconds_bucket{route=\"/api/v1/query\"}[$__rate_interval])))", "legendFormat": "p95", "refId": "B"},
            {"expr": "histogram_quantile(0.99, sum by (le) (rate(kuberag_api_request_duration_seconds_bucket{route=\"/api/v1/query\"}[$__rate_interval])))", "legendFormat": "p99", "refId": "C"}
          ],
          "title": "RAG query latency percentiles",
          "type": "timeseries"
        },
        {
          "datasource": {"type": "prometheus", "uid": "prometheus"},
          "fieldConfig": {"defaults": {"unit": "reqps"}, "overrides": []},
          "gridPos": {"h": 8, "w": 12, "x": 12, "y": 0},
          "id": 2,
          "targets": [{"expr": "sum by (status_code) (rate(kuberag_api_requests_total{route=\"/api/v1/query\"}[$__rate_interval]))", "legendFormat": "{{status_code}}", "refId": "A"}],
          "title": "RAG query outcomes",
          "type": "timeseries"
        },
        {
          "datasource": {"type": "prometheus", "uid": "prometheus"},
          "fieldConfig": {"defaults": {"unit": "s"}, "overrides": []},
          "gridPos": {"h": 8, "w": 12, "x": 0, "y": 8},
          "id": 3,
          "targets": [{"expr": "histogram_quantile(0.95, sum by (le, stage) (rate(kuberag_rag_stage_duration_seconds_bucket[$__rate_interval])))", "legendFormat": "{{stage}} p95", "refId": "A"}],
          "title": "RAG pipeline p95 by stage",
          "type": "timeseries"
        },
        {
          "datasource": {"type": "prometheus", "uid": "prometheus"},
          "fieldConfig": {"defaults": {"unit": "ops"}, "overrides": []},
          "gridPos": {"h": 8, "w": 12, "x": 12, "y": 8},
          "id": 4,
          "options": {"colorMode": "value", "graphMode": "area", "justifyMode": "auto", "orientation": "auto", "textMode": "auto"},
          "targets": [
            {"expr": "sum(increase(kuberag_api_requests_total{route=\"/api/v1/query\",status_code=~\"5..\"}[30m]))", "legendFormat": "query 5xx / 30m", "refId": "A"},
            {"expr": "sum(increase(envoy_http_local_rate_limit_rate_limited[30m]))", "legendFormat": "Envoy 429 / 30m", "refId": "B"}
          ],
          "title": "Errors and rate limiting",
          "type": "stat"
        },
        {
          "datasource": {"type": "prometheus", "uid": "prometheus"},
          "fieldConfig": {"defaults": {"unit": "short", "min": 0, "max": 1}, "overrides": []},
          "gridPos": {"h": 7, "w": 6, "x": 0, "y": 16},
          "id": 5,
          "options": {"colorMode": "background", "graphMode": "none", "justifyMode": "auto", "orientation": "auto", "textMode": "auto"},
          "targets": [{"expr": "min(kube_pod_container_status_ready{namespace=\"rag\",container=\"rag-warmup\"})", "legendFormat": "warm-up ready", "refId": "A"}],
          "title": "Warm-up readiness gate",
          "type": "stat"
        },
        {
          "datasource": {"type": "prometheus", "uid": "prometheus"},
          "fieldConfig": {"defaults": {"unit": "short", "min": 0, "max": 1}, "overrides": []},
          "gridPos": {"h": 7, "w": 6, "x": 6, "y": 16},
          "id": 6,
          "options": {"colorMode": "background", "graphMode": "none", "justifyMode": "auto", "orientation": "auto", "textMode": "auto"},
          "targets": [{"expr": "min by (job) (up{job=~\"kuberag-rag-api|kuberag-otel-collector|kuberag-tempo|observability/kuberag-loki|kuberag-monitoring-grafana\"})", "legendFormat": "{{job}}", "refId": "A"}],
          "title": "Telemetry and API scrape health",
          "type": "stat"
        },
        {
          "datasource": {"type": "prometheus", "uid": "prometheus"},
          "fieldConfig": {"defaults": {"unit": "cores"}, "overrides": []},
          "gridPos": {"h": 8, "w": 12, "x": 12, "y": 16},
          "id": 7,
          "targets": [{"expr": "sum by (pod, container) (rate(container_cpu_usage_seconds_total{namespace=\"rag\",container=~\"api|rag-warmup|llama-server\"}[$__rate_interval]))", "legendFormat": "{{pod}}/{{container}}", "refId": "A"}],
          "title": "RAG API and llama.cpp CPU",
          "type": "timeseries"
        },
        {
          "datasource": {"type": "prometheus", "uid": "prometheus"},
          "fieldConfig": {"defaults": {"unit": "bytes"}, "overrides": []},
          "gridPos": {"h": 8, "w": 12, "x": 0, "y": 24},
          "id": 8,
          "targets": [{"expr": "sum by (pod, container) (container_memory_working_set_bytes{namespace=\"rag\",container=~\"api|rag-warmup|llama-server\"})", "legendFormat": "{{pod}}/{{container}}", "refId": "A"}],
          "title": "RAG API and llama.cpp memory",
          "type": "timeseries"
        },
        {
          "datasource": {"type": "prometheus", "uid": "prometheus"},
          "fieldConfig": {"defaults": {"unit": "percent", "min": 0, "max": 100}, "overrides": []},
          "gridPos": {"h": 8, "w": 12, "x": 12, "y": 24},
          "id": 9,
          "targets": [{"expr": "100 * (1 - (kubelet_volume_stats_available_bytes{namespace=~\"rag|data|observability\"} / kubelet_volume_stats_capacity_bytes{namespace=~\"rag|data|observability\"}))", "legendFormat": "{{namespace}}/{{persistentvolumeclaim}}", "refId": "A"}],
          "title": "PVC usage",
          "type": "timeseries"
        },
        {
          "datasource": {"type": "prometheus", "uid": "prometheus"},
          "fieldConfig": {"defaults": {"unit": "short"}, "overrides": []},
          "gridPos": {"h": 8, "w": 12, "x": 0, "y": 32},
          "id": 10,
          "targets": [{"expr": "sum by (namespace, pod) (kube_pod_container_status_restarts_total{namespace=~\"rag|data|observability\"})", "legendFormat": "{{namespace}}/{{pod}}", "refId": "A"}],
          "title": "Workload restart count",
          "type": "timeseries"
        },
        {
          "datasource": {"type": "loki", "uid": "loki"},
          "gridPos": {"h": 8, "w": 12, "x": 12, "y": 32},
          "id": 11,
          "options": {"dedupStrategy": "none", "enableLogDetails": true, "prettifyJSON": false, "showCommonLabels": false, "showLabels": false, "showTime": true, "sortOrder": "Descending", "wrapLogMessage": true},
          "targets": [{"expr": "{service_name=\"kuberag-rag-api\"} |= \"request_completed\"", "refId": "A"}],
          "title": "Recent RAG API events (Loki)",
          "type": "logs"
        }
      ],
      "schemaVersion": 41,
      "tags": ["kuberag", "operations", "provisioned"],
      "templating": {"list": []},
      "time": {"from": "now-6h", "to": "now"},
      "title": "KubeRAG Operations",
      "uid": "kuberag-operations",
      "version": 1
    }
