apiVersion: apps/v1
kind: Deployment
metadata:
  name: prefect-worker
  namespace: prefect
  labels:
    app.kubernetes.io/name: prefect-worker
    app.kubernetes.io/part-of: kuberag
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: prefect-worker
  template:
    metadata:
      labels:
        app.kubernetes.io/name: prefect-worker
        app.kubernetes.io/part-of: kuberag
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: worker
          image: kuberag-ingestion:local
          imagePullPolicy: Never
          args:
            - /app/.venv/bin/prefect
            - worker
            - start
            - --pool
            - kuberag-ingestion
            - --type
            - process
            - --with-healthcheck
          ports:
            - name: health
              containerPort: 8080
          env:
            - name: PREFECT_HOME
              value: /tmp/prefect-home
            - name: PREFECT_API_URL
              value: http://prefect-server.prefect.svc.cluster.local:4200/api
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: kuberag-db-app
                  key: uri
            - name: KUBERAG_EMBEDDING_MODE
              value: e5
            - name: KUBERAG_EMBEDDING_CACHE
              value: /models
            - name: KUBERAG_EMBEDDING_LOCAL_ONLY
              value: "true"
            - name: HF_HOME
              value: /models/hf
            - name: TRANSFORMERS_CACHE
              value: /models/hf
            - name: SENTENCE_TRANSFORMERS_HOME
              value: /models
            - name: HOME
              value: /tmp
            - name: KUBERAG_HTTP_TIMEOUT_SECONDS
              value: "30"
            - name: KUBERAG_HTTP_MAX_ATTEMPTS
              value: "3"
            - name: KUBERAG_EMBEDDING_BATCH_SIZE
              value: "8"
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          resources:
            requests:
              cpu: 250m
              memory: 1Gi
            limits:
              cpu: "2"
              memory: 3Gi
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: models
              mountPath: /models
          readinessProbe:
            httpGet:
              path: /health
              port: health
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: health
            initialDelaySeconds: 30
            periodSeconds: 20
      volumes:
        - name: tmp
          emptyDir: {}
        - name: models
          persistentVolumeClaim:
            claimName: kuberag-embedding-models
