apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: kuberag-pg
  namespace: data
spec:
  instances: 1
  imageName: ghcr.io/cloudnative-pg/postgresql:18.4-standard-trixie@sha256:c94c6b0db7bc90c4d89cc0950fbb22907aa55df0e948cbc112adb87846660974
  enableSuperuserAccess: false

  bootstrap:
    initdb:
      database: kuberag
      owner: kuberag
      encoding: UTF8
      localeCType: C
      localeCollate: C
      dataChecksums: true

  storage:
    storageClass: local-path
    size: 20Gi

  resources:
    requests:
      cpu: 250m
      memory: 512Mi
    limits:
      cpu: "1"
      memory: 1536Mi

  postgresql:
    parameters:
      max_connections: "50"
      shared_buffers: 128MB
