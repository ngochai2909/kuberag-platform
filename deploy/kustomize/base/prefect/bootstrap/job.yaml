apiVersion: batch/v1
kind: Job
metadata:
  name: prefect-bootstrap
  namespace: prefect
  labels:
    app.kubernetes.io/name: prefect-bootstrap
    app.kubernetes.io/part-of: kuberag
spec:
  backoffLimit: 2
  ttlSecondsAfterFinished: 600
  template:
    metadata:
      labels:
        app.kubernetes.io/name: prefect-bootstrap
        app.kubernetes.io/part-of: kuberag
    spec:
      restartPolicy: Never
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: bootstrap
          image: kuberag-ingestion:local
          imagePullPolicy: Never
          args:
            - /app/.venv/bin/python
            - -m
            - ingestion.bootstrap_prefect
          env:
            - name: PREFECT_HOME
              value: /tmp/prefect-home
            - name: PREFECT_API_URL
              value: http://prefect-server.prefect.svc.cluster.local:4200/api
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          resources:
            requests:
              cpu: 50m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
