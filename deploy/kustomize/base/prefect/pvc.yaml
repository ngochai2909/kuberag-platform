apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: prefect-server-data
  namespace: prefect
  labels:
    app.kubernetes.io/name: prefect-server
    app.kubernetes.io/part-of: kuberag
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: local-path
  resources:
    requests:
      storage: 2Gi
