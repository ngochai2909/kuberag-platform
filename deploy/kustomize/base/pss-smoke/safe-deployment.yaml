apiVersion: apps/v1
kind: Deployment
metadata:
  name: kuberag-pss-smoke
  namespace: rag
  labels:
    app.kubernetes.io/name: kuberag-pss-smoke
    app.kubernetes.io/part-of: kuberag
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: kuberag-pss-smoke
  template:
    metadata:
      labels:
        app.kubernetes.io/name: kuberag-pss-smoke
        app.kubernetes.io/part-of: kuberag
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: smoke
          image: registry.k8s.io/e2e-test-images/agnhost:2.53
          args:
            - netexec
            - --http-port=8080
          ports:
            - name: http
              containerPort: 8080
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 100m
              memory: 64Mi
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 2
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 10
            periodSeconds: 20
