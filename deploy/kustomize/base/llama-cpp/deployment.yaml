apiVersion: apps/v1
kind: Deployment
metadata:
  name: kuberag-llm
  namespace: rag
  labels:
    app.kubernetes.io/name: kuberag-llm
    app.kubernetes.io/part-of: kuberag
  annotations:
    kuberag.io/model-revision: 91cad51170dc346986eccefdc2dd33a9da36ead9
    kuberag.io/model-sha256: 6a1a2eb6d15622bf3c96857206351ba97e1af16c30d7a74ee38970e434e9407e
spec:
  replicas: 1
  # The model PVC is ReadWriteOnce, so no overlapping Pod may mount it.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: kuberag-llm
  template:
    metadata:
      labels:
        app.kubernetes.io/name: kuberag-llm
        app.kubernetes.io/part-of: kuberag
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        - name: model-download
          image: docker.io/library/busybox@sha256:9532d8c39891ca2ecde4d30d7710e01fb739c87a8b9299685c63704296b16028
          command:
            - /bin/sh
            - -ec
          args:
            - |
              model=/models/qwen2.5-1.5b-instruct-q4_k_m.gguf
              expected_sha256=6a1a2eb6d15622bf3c96857206351ba97e1af16c30d7a74ee38970e434e9407e
              if [ -f "$model" ] && printf '%s  %s\n' "$expected_sha256" "$model" | sha256sum -c -; then
                exit 0
              fi
              rm -f "$model" "$model.tmp"
              wget -O "$model.tmp" https://huggingface.co/Qwen/Qwen2.5-1.5B-Instruct-GGUF/resolve/91cad51170dc346986eccefdc2dd33a9da36ead9/qwen2.5-1.5b-instruct-q4_k_m.gguf
              printf '%s  %s\n' "$expected_sha256" "$model.tmp" | sha256sum -c -
              mv "$model.tmp" "$model"
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
          volumeMounts:
            - name: models
              mountPath: /models
            - name: tmp
              mountPath: /tmp
      containers:
        - name: llama-server
          image: ghcr.io/ggml-org/llama.cpp@sha256:51570a4f93c5ce81ac6f2b1ea16a58771cfded2adb34241df7e75329b24fe76e
          args:
            - --model
            - /models/qwen2.5-1.5b-instruct-q4_k_m.gguf
            - --alias
            - kuberag-qwen2.5-1.5b
            - --ctx-size
            - "4096"
            - --threads
            - "4"
            - --threads-batch
            - "4"
            - --host
            - 0.0.0.0
            - --port
            - "8080"
          env:
            - name: HOME
              value: /tmp
          ports:
            - name: http
              containerPort: 8080
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          resources:
            requests:
              cpu: "2"
              memory: 4Gi
            limits:
              cpu: "4"
              memory: 6Gi
          volumeMounts:
            - name: models
              mountPath: /models
            - name: tmp
              mountPath: /tmp
          startupProbe:
            httpGet:
              path: /health
              port: http
            failureThreshold: 90
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 30
            periodSeconds: 20
      volumes:
        - name: models
          persistentVolumeClaim:
            claimName: kuberag-llm-models
        - name: tmp
          emptyDir: {}
