apiVersion: apps/v1
kind: Deployment
metadata:
  name: kuberag-web
  namespace: rag
  labels:
    app.kubernetes.io/name: kuberag-web
    app.kubernetes.io/part-of: kuberag
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: kuberag-web
  template:
    metadata:
      labels:
        app.kubernetes.io/name: kuberag-web
        app.kubernetes.io/part-of: kuberag
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: web
          image: kuberag-web:local
          imagePullPolicy: Never
          ports:
            - name: http
              containerPort: 8080
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 128Mi
          volumeMounts:
            - name: tmp
              mountPath: /tmp
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 3
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 10
            periodSeconds: 20
      volumes:
        - name: tmp
          emptyDir: {}
