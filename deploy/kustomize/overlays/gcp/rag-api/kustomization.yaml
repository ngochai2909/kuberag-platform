apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../../base/rag-api
patches:
  - target:
      group: apps
      version: v1
      kind: Deployment
      name: kuberag-rag-api
      namespace: rag
    patch: |-
      - op: replace
        path: /spec/template/spec/containers/0/env/2/value
        value: "false"
      - op: remove
        path: /spec/template/spec/containers/0/env/3
      - op: add
        path: /spec/template/spec/containers/0/env/-
        value:
          name: PUBLIC_DEMO_MODE
          value: "true"
      - op: add
        path: /spec/template/spec/containers/0/env/-
        value:
          name: OTEL_ENABLED
          value: "true"
      - op: add
        path: /spec/template/spec/containers/0/env/-
        value:
          name: OTEL_EXPORTER_OTLP_ENDPOINT
          value: kuberag-otel-collector.observability.svc.cluster.local:4317
      - op: add
        path: /spec/template/spec/containers/0/env/-
        value:
          name: PYROSCOPE_ENABLED
          value: "true"
      - op: add
        path: /spec/template/spec/containers/0/env/-
        value:
          name: PYROSCOPE_SERVER_ADDRESS
          value: http://kuberag-pyroscope.observability.svc.cluster.local:4040
