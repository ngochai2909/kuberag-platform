apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: kuberag-web
  namespace: rag
  labels:
    app.kubernetes.io/part-of: kuberag
spec:
  parentRefs:
    - name: kuberag
      sectionName: http
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: kuberag-web
          port: 80
