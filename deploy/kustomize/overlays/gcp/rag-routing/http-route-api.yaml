apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: kuberag-api
  namespace: rag
  labels:
    app.kubernetes.io/part-of: kuberag
spec:
  parentRefs:
    - name: kuberag
      sectionName: http
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /api/
      timeouts:
        # Keep Envoy above rag-api RAG_TIMEOUT_SECONDS (90s) so the app owns the cut.
        request: 100s
        backendRequest: 95s
      backendRefs:
        - name: kuberag-rag-api
          port: 80
