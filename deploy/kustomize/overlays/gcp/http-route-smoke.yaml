apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: kuberag-smoke
  namespace: rag
spec:
  parentRefs:
    - name: kuberag
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: kuberag-pss-smoke
          port: 80
