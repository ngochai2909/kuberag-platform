apiVersion: batch/v1
kind: Job
metadata:
  name: kuberag-prefect-embedding-warm
  namespace: prefect
  labels:
    app.kubernetes.io/name: kuberag-prefect-embedding-warm
    app.kubernetes.io/part-of: kuberag
spec:
  backoffLimit: 2
  activeDeadlineSeconds: 1800
  ttlSecondsAfterFinished: 86400
  template:
    metadata:
      labels:
        app.kubernetes.io/name: kuberag-prefect-embedding-warm
        app.kubernetes.io/part-of: kuberag
    spec:
      automountServiceAccountToken: false
      restartPolicy: Never
      nodeSelector:
        kuberag.io/role: application
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: download
          image: kuberag-ingestion:local
          imagePullPolicy: IfNotPresent
          args:
            - /app/.venv/bin/python
            - -c
            - |
              import os
              import time
              from sentence_transformers import SentenceTransformer

              model_id = "intfloat/multilingual-e5-small"
              cache = os.environ["KUBERAG_EMBEDDING_CACHE"]
              started = time.perf_counter()
              model = SentenceTransformer(model_id, cache_folder=cache)
              vector = model.encode(
                  ["query: kuberag three node warm"],
                  normalize_embeddings=True,
                  show_progress_bar=False,
              )[0]
              elapsed_ms = (time.perf_counter() - started) * 1000
              print(f"ok dims={len(vector)} elapsed_ms={elapsed_ms:.0f}", flush=True)
          env:
            - name: KUBERAG_EMBEDDING_CACHE
              value: /models
            - name: HF_HOME
              value: /models/hf
            - name: TRANSFORMERS_CACHE
              value: /models/hf
            - name: SENTENCE_TRANSFORMERS_HOME
              value: /models
            - name: HOME
              value: /tmp
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          resources:
            requests:
              cpu: 500m
              memory: 1Gi
            limits:
              cpu: "2"
              memory: 2Gi
          volumeMounts:
            - name: models
              mountPath: /models
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: models
          persistentVolumeClaim:
            claimName: kuberag-embedding-models-application
        - name: tmp
          emptyDir: {}
