apiVersion: batch/v1
kind: Job
metadata:
  name: kuberag-llm-model-warm
  namespace: rag
  labels:
    app.kubernetes.io/name: kuberag-llm-model-warm
    app.kubernetes.io/part-of: kuberag
spec:
  backoffLimit: 2
  activeDeadlineSeconds: 1800
  ttlSecondsAfterFinished: 86400
  template:
    metadata:
      labels:
        app.kubernetes.io/name: kuberag-llm-model-warm
        app.kubernetes.io/part-of: kuberag
    spec:
      automountServiceAccountToken: false
      restartPolicy: Never
      nodeSelector:
        kuberag.io/role: application
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: download
          image: docker.io/library/busybox@sha256:9532d8c39891ca2ecde4d30d7710e01fb739c87a8b9299685c63704296b16028
          command:
            - /bin/sh
            - -ec
          args:
            - |
              model=/models/qwen2.5-1.5b-instruct-q4_k_m.gguf
              expected_sha256=6a1a2eb6d15622bf3c96857206351ba97e1af16c30d7a74ee38970e434e9407e
              if [ -f "$model" ] && printf '%s  %s\n' "$expected_sha256" "$model" | sha256sum -c -; then
                exit 0
              fi
              rm -f "$model" "$model.tmp"
              wget -O "$model.tmp" https://huggingface.co/Qwen/Qwen2.5-1.5B-Instruct-GGUF/resolve/91cad51170dc346986eccefdc2dd33a9da36ead9/qwen2.5-1.5b-instruct-q4_k_m.gguf
              printf '%s  %s\n' "$expected_sha256" "$model.tmp" | sha256sum -c -
              mv "$model.tmp" "$model"
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
          volumeMounts:
            - name: models
              mountPath: /models
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: models
          persistentVolumeClaim:
            claimName: kuberag-llm-models-application
        - name: tmp
          emptyDir: {}
