apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../../gcp/postgresql

patches:
  - target:
      group: postgresql.cnpg.io
      version: v1
      kind: Cluster
      name: kuberag-pg
      namespace: data
    patch: |-
      - op: replace
        path: /spec/instances
        value: 2
      - op: add
        path: /spec/affinity
        value:
          nodeAffinity:
            requiredDuringSchedulingIgnoredDuringExecution:
              nodeSelectorTerms:
                - matchExpressions:
                    - key: kuberag.io/role
                      operator: In
                      values:
                        - all-in-one
                        - observability
                        - application
          podAntiAffinityType: required
          topologyKey: kubernetes.io/hostname
