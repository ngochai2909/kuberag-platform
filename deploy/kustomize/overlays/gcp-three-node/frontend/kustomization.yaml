apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../../gcp-release/frontend

patches:
  - target:
      group: apps
      version: v1
      kind: Deployment
      name: kuberag-web
      namespace: rag
    patch: |-
      - op: add
        path: /spec/template/spec/nodeSelector
        value:
          kuberag.io/role: application
