apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../../gcp/llama-cpp
  - model-pvc.yaml

patches:
  - target:
      group: apps
      version: v1
      kind: Deployment
      name: kuberag-llm
      namespace: rag
    patch: |-
      - op: add
        path: /spec/template/spec/nodeSelector
        value:
          kuberag.io/role: application
      - op: replace
        path: /spec/template/spec/volumes/0/persistentVolumeClaim/claimName
        value: kuberag-llm-models-application
