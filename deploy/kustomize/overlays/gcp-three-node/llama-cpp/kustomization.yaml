apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../../gcp/llama-cpp
  - model-pvc.yaml

patches:
  - target:
      group: apps
      version: v1
      kind: Deployment
      name: kuberag-llm
      namespace: rag
    patch: |-
      - op: add
        path: /spec/template/spec/nodeSelector
        value:
          kuberag.io/role: application
      - op: replace
        path: /spec/template/spec/volumes/0/persistentVolumeClaim/claimName
        value: kuberag-llm-models-application
      # Application worker is 2 vCPU / ~8 GiB. Keep limits for burst;
      # lower requests so LLM + RAG API + Prefect fit scheduler packing.
      - op: replace
        path: /spec/template/spec/containers/0/resources/requests/cpu
        value: "500m"
      - op: replace
        path: /spec/template/spec/containers/0/resources/requests/memory
        value: 3Gi
