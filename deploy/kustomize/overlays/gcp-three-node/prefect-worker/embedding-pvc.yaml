apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: kuberag-embedding-models-application
  namespace: prefect
  labels:
    app.kubernetes.io/name: kuberag-embedding-models
    app.kubernetes.io/part-of: kuberag
    kuberag.io/role: application
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: local-path
  resources:
    requests:
      storage: 5Gi
