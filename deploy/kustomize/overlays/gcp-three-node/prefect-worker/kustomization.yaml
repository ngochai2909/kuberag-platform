apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../../gcp-release/prefect-worker
  - embedding-pvc.yaml

patches:
  - target:
      group: apps
      version: v1
      kind: Deployment
      name: prefect-worker
      namespace: prefect
    patch: |-
      - op: add
        path: /spec/template/spec/nodeSelector
        value:
          kuberag.io/role: application
      - op: replace
        path: /spec/template/spec/volumes/1/persistentVolumeClaim/claimName
        value: kuberag-embedding-models-application
      # Idle worker shares the 2 vCPU node with RAG/LLM; burst via limits.
      - op: replace
        path: /spec/template/spec/containers/0/resources/requests/cpu
        value: "100m"
      - op: replace
        path: /spec/template/spec/containers/0/resources/requests/memory
        value: 768Mi
