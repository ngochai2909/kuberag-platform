apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../../gcp-release/rag-api
  - embedding-pvc.yaml

patches:
  - target:
      group: apps
      version: v1
      kind: Deployment
      name: kuberag-rag-api
      namespace: rag
    patch: |-
      - op: add
        path: /spec/template/spec/nodeSelector
        value:
          kuberag.io/role: application
      - op: replace
        path: /spec/template/spec/volumes/1/persistentVolumeClaim/claimName
        value: kuberag-rag-embedding-models-application
      # Pack onto the 2 vCPU application worker with llama.cpp and Prefect.
      - op: replace
        path: /spec/template/spec/containers/0/resources/requests/cpu
        value: "500m"
      - op: replace
        path: /spec/template/spec/containers/0/resources/requests/memory
        value: 1536Mi
