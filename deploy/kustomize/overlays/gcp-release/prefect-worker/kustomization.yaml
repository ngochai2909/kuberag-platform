apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../gcp/prefect-worker
images:
  - name: kuberag-ingestion
    newName: asia-southeast1-docker.pkg.dev/kube-rag-platform/kuberag/kuberag-ingestion
    digest: sha256:c574d4befc49d1ffe66f7c7f05e5555933136d6630a3f9a3601d566ce7f306ff
patches:
  - target:
      group: apps
      version: v1
      kind: Deployment
      name: prefect-worker
      namespace: prefect
    patch: |-
      - op: replace
        path: /spec/template/spec/initContainers/0/imagePullPolicy
        value: IfNotPresent
      - op: replace
        path: /spec/template/spec/containers/0/imagePullPolicy
        value: IfNotPresent
