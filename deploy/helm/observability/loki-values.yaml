# Loki runs as one persistent binary: no object storage, gateway, cache, or
# canary is needed for the short-retention single-node demo.
deploymentMode: SingleBinary
loki:
  auth_enabled: false
  useTestSchema: true
  commonConfig:
    replication_factor: 1
  storage:
    type: filesystem
    bucketNames:
      chunks: chunks
      ruler: ruler
      admin: admin
  analytics:
    reporting_enabled: false
  limits_config:
    retention_period: 72h
    allow_structured_metadata: true
  compactor:
    retention_enabled: true
    delete_request_store: filesystem
singleBinary:
  replicas: 1
  resources:
    requests:
      cpu: 150m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi
  persistence:
    enabled: true
    size: 5Gi
gateway:
  enabled: false
read:
  replicas: 0
write:
  replicas: 0
backend:
  replicas: 0
chunksCache:
  enabled: false
resultsCache:
  enabled: false
lokiCanary:
  enabled: false
ruler:
  enabled: false
test:
  enabled: false
monitoring:
  serviceMonitor:
    enabled: true
