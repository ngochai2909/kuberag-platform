name: CI

on:
  pull_request:
  push:
    branches: [main, master]

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]

    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.11.15"
          enable-cache: true
      - name: Install Python
        run: uv python install ${{ matrix.python-version }}
      - name: Install dependencies
        run: uv sync --frozen --group dev
      - name: Ruff lint
        run: uv run ruff check apps/rag-api/src apps/rag-api/tests
      - name: Ruff format
        run: uv run ruff format --check apps/rag-api/src apps/rag-api/tests
      - name: Type check
        run: uv run mypy apps/rag-api/src apps/rag-api/tests
      - name: Test
        run: uv run pytest
